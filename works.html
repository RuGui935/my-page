<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>封赏 · 作品集</title>
    <style>
        /* ===== 全局重置 — 继承自介游戏化风格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1b1e2b;
            background-image: radial-gradient(circle at 10% 30%, #2d3040 0%, #171a26 90%);
            font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 1.2rem 1rem 2.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #eaeef2;
        }

        /* ===== 主卡片 ===== */
        .profile-card {
            max-width: 700px;
            width: 100%;
            background: rgba(30, 34, 48, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 48px 48px 32px 32px;
            padding: 2rem 1.8rem 2.2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 215, 150, 0.08);
            border: 1px solid rgba(255, 215, 150, 0.15);
            transition: all 0.2s ease;
        }

        /* ===== 返回按钮 ===== */
        .back-bar {
            margin-bottom: 1.2rem;
        }
        .back-btn {
            display: inline-block;
            background: rgba(60, 55, 70, 0.4);
            border-radius: 40px;
            padding: 0.3rem 1.4rem;
            font-size: 0.85rem;
            color: #d6ceb8;
            text-decoration: none;
            border: 1px solid #5a5a7a;
            transition: 0.2s;
            backdrop-filter: blur(2px);
            letter-spacing: 0.3px;
        }
        .back-btn:hover {
            background: #dbb594;
            color: #1b1e2b;
            border-color: #dbb594;
            transform: translateX(-4px);
        }
        .back-btn::before {
            content: "← ";
        }

        /* ===== 标题区 ===== */
        .page-header {
            text-align: center;
            padding-bottom: 1.2rem;
            border-bottom: 1px dashed rgba(255, 215, 150, 0.2);
            margin-bottom: 1.6rem;
        }
        .page-header h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f7d8a8, #f0c08c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.3;
        }
        .page-header .subtitle {
            font-size: 0.8rem;
            color: #8a7e6e;
            letter-spacing: 2px;
            margin-top: 0.2rem;
        }

        /* ===== 分区 ===== */
        .gallery-section {
            margin-top: 1.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(200, 180, 155, 0.1);
        }
        .gallery-section:first-of-type {
            border-top: none;
            margin-top: 0;
            padding-top: 0;
        }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .section-header .section-name {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #e2d4c0;
        }
        .section-header .section-badge {
            font-size: 0.6rem;
            background: #3b3f5a;
            padding: 0.05rem 0.8rem;
            border-radius: 30px;
            color: #bdb6a2;
            border: 1px solid #585c78;
            letter-spacing: 0.5px;
        }
        .section-header .section-count {
            font-size: 0.7rem;
            color: #6a5e4e;
            margin-left: auto;
        }

        /* ===== 作品网格 ===== */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }

        /* ===== 作品卡片 ===== */
        .work-item {
            background: rgba(20, 22, 35, 0.5);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 150, 0.08);
            transition: 0.2s ease;
            aspect-ratio: 3 / 4; /* 封面默认 3:4 */
            display: flex;
            flex-direction: column;
        }
        .work-item:hover {
            border-color: rgba(255, 215, 150, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* 头像专用 — 覆盖为 1:1 */
        .work-item.avatar {
            aspect-ratio: 1 / 1;
        }

        /* 图片占位区 */
        .work-img {
            width: 100%;
            flex: 1;
            background: #242838;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #5a4e3e;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .work-img .placeholder-icon {
            font-size: 1.8rem;
            opacity: 0.3;
        }
        .work-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 作品名称 */
        .work-label {
            padding: 0.3rem 0.4rem 0.4rem;
            font-size: 0.6rem;
            color: #8a7e6e;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
        }

        /* ===== 空状态占位 ===== */
        .empty-placeholder {
            grid-column: 1 / -1;
            color: #4a3e2e;
            font-size: 0.85rem;
            padding: 1.2rem 0;
            text-align: center;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* ===== 底部 ===== */
        .page-footer {
            margin-top: 2.2rem;
            padding-top: 1.2rem;
            border-top: 1px dashed rgba(255, 215, 150, 0.1);
            text-align: center;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }
        .footer-back, .footer-top {
            display: inline-block;
            background: rgba(60, 55, 70, 0.4);
            border-radius: 40px;
            padding: 0.3rem 1.6rem;
            font-size: 0.85rem;
            color: #d6ceb8;
            text-decoration: none;
            border: 1px solid #5a5a7a;
            transition: 0.2s;
            backdrop-filter: blur(2px);
        }
        .footer-back:hover, .footer-top:hover {
            background: #dbb594;
            color: #1b1e2b;
            border-color: #dbb594;
            transform: translateX(-4px);
        }
        .footer-back::before {
            content: "← ";
        }
        .footer-top::after {
            content: " ↑";
        }
        .footer-end {
            display: block;
            font-size: 0.7rem;
            color: #5a4e3e;
            letter-spacing: 3px;
            margin-bottom: 0.4rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            /* 手机上显示为 2 列 */
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }
            .work-item {
                border-radius: 12px;
            }
            .work-label {
                font-size: 0.55rem;
                padding: 0.2rem 0.3rem 0.3rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.8rem 0.6rem 1.8rem;
            }
            .profile-card {
                padding: 1.5rem 1rem 1.8rem;
                border-radius: 32px 32px 24px 24px;
            }
            .page-header h1 {
                font-size: 1.6rem;
            }
            .section-header .section-name {
                font-size: 1.1rem;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 0.2rem 1rem;
            }
            .footer-back, .footer-top {
                font-size: 0.75rem;
                padding: 0.2rem 1.2rem;
            }
            .grid-4 {
                gap: 0.5rem;
            }
        }

        @media (max-width: 380px) {
            .profile-card {
                padding: 1rem 0.8rem 1.4rem;
                border-radius: 24px;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
            .grid-4 {
                gap: 0.4rem;
            }
            .work-label {
                font-size: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">

        <!-- ===== 顶部返回 ===== -->
        <div class="back-bar">
            <a href="javascript:history.back()" class="back-btn">返回主页</a>
        </div>

        <!-- ===== 标题 ===== -->
        <div class="page-header">
            <h1>🎨 封赏</h1>
            <p class="subtitle">—— 平面设计 · 作品集</p>
        </div>

        <!-- ============================================================ -->
        <!-- 分区一：封面 (3:4) -->
        <!-- ============================================================ -->
        <div class="gallery-section">
            <div class="section-header">
                <span class="section-name">📘 封面</span>
                <span class="section-badge">竖版    3:4</span>
                <span class="section-count">共 4 件</span>
            </div>
            <div class="grid-4">
                <!-- 示例作品 1 -->
                <div class="work-item">
                    <div class="work-img">
                        <!-- 替换为 <img src="你的图片地址.jpg" alt="作品名"> -->
                         <img src="./assets/covers/死亡里遇见你.jpg" alt="死亡里遇见你">
                        <!-- <span class="placeholder-icon">🖼️</span> -->
                    </div>
                    <div class="work-label">死亡里遇见你</div>
                </div>
                <!-- 示例作品 2 -->
                <div class="work-item">
                    <div class="work-img">
                        <img src="./assets/covers/相遇的季节.jpg" alt="相遇的季节">
                        <!-- <span class="placeholder-icon">🖼️</span> -->
                    </div>
                    <div class="work-label">相遇的季节</div>
                </div>
                <!-- 示例作品 3 -->
                <div class="work-item">
                    <div class="work-img">
                        <img src="./assets/covers/且饮一念劫.jpg" alt="且饮一念劫">
                        <!-- <span class="placeholder-icon">🖼️</span> -->
                    </div>
                    <div class="work-label">且饮一念劫</div>
                </div>
                <!-- 示例作品 4 -->
                <div class="work-item">
                    <div class="work-img">
                        <img src="./assets/covers/恋爱脑帝王：杀妻正道后殉情.jpg" alt="恋爱脑帝王：杀妻正道后殉情">
                        <!-- <span class="placeholder-icon">🖼️</span> -->
                    </div>
                    <div class="work-label">恋爱脑帝王：杀妻正道后殉情</div>
                </div>
                <!-- 空状态占位（无内容时显示，有内容后可删除） -->
                <!-- <div class="empty-placeholder">— 在这里添加你的封面作品 —</div> -->
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- 分区二：头像 (1:1) -->
        <!-- ============================================================ -->
        <div class="gallery-section">
            <div class="section-header">
                <span class="section-name">👤 头像</span>
                <span class="section-badge">1:1</span>
                <span class="section-count">共 4 件</span>
            </div>
            <div class="grid-4">
                <!-- 示例头像 1 — 添加 .avatar 类 -->
                <div class="work-item avatar">
                    <div class="work-img">
                        <!-- <span class="placeholder-icon">👤</span> -->
                        <img src="./assets/avatars/回溯.jpg" alt="回溯">
                    </div>
                    <div class="work-label">回溯</div>
                </div>
                <!-- 示例头像 2 -->
                <div class="work-item avatar">
                    <div class="work-img">
                        <!-- <span class="placeholder-icon">👤</span> -->
                        <img src="./assets/avatars/秋季的意象.jpg" alt="秋季的意象">
                    </div>
                    <div class="work-label">秋季的意象</div>
                </div>
                <!-- 示例头像 3 -->
                <div class="work-item avatar">
                    <div class="work-img">
                        <!-- <span class="placeholder-icon">👤</span> -->
                        <img src="./assets/avatars/秋籁.jpg" alt="秋籁">
                    </div>
                    <div class="work-label">秋籁</div>
                </div>
                <!-- 示例头像 4 -->
                <div class="work-item avatar">
                    <div class="work-img">
                        <!-- <span class="placeholder-icon">👤</span> -->
                        <img src="./assets/avatars/荷尔加.jpg" alt="荷尔加">
                    </div>
                    <div class="work-label">荷尔加</div>
                </div>
                <!-- 空状态占位 -->
                <!-- <div class="empty-placeholder">— 在这里添加你的头像作品 —</div> -->
            </div>
        </div>

        <!-- ===== 底部 ===== -->
        <div class="page-footer">
            <span class="footer-end">✦ 持续更新 ✦</span>
            <div class="footer-links">
                <a href="./index.html" class="footer-back">返回主页</a>
                <a href="#" class="footer-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">返回顶部</a>
            </div>
        </div>

    </div>

</body>
</html>
